<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Screening System</title>

    <link rel="stylesheet" href="css/role-selection.css">
</head>

<body>

    <main class="role-page">

        <section class="role-card">

            <div class="brand">
                <div class="brand-icon">🤖</div>

                <h1>AI Resume Screening System</h1>

                <p>
                    Smart recruitment made easier and faster.
                </p>
            </div>

            <h2>Welcome</h2>

            <p class="select-text">
                Select your role to continue
            </p>

            <div class="role-options">

    <button
        type="button"
        class="role-button candidate-btn"
        onclick="window.location.href='candidate-login.html'">

        <span class="role-icon">👤</span>

        <span>
            <strong>Candidate</strong>
            <small>Find opportunities and manage your applications</small>
        </span>

    </button>


    <button
        type="button"
        class="role-button hr-btn"
        onclick="window.location.href='hr-login.html'">

        <span class="role-icon">💼</span>

        <span>
            <strong>HR</strong>
            <small>Manage jobs, candidates and recruitment</small>
        </span>

    </button>

    </div>

            <p class="footer-text">
                AI-powered recruitment platform
            </p>

        </section>

    </main>

    <script src="js/role-selection.js"></script>

</body>
</html>
